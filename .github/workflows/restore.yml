name: restore-original-files

on:
  push:
    paths:
      - '.github/workflows/restore.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore files to the state before deletion
        run: |
          git config user.name "crabAI-restore-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout a3a8e8ae6fbe02528ff012619af1866f5e9db8d5 -- .
          git add -A
          git commit -m "restore: revert accidental deletions, restore file state of a3a8e8a" || echo "nothing to commit"
          git push
